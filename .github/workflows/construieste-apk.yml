name: Construieste APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ia fisierele
        uses: actions/checkout@v4

      - name: Gaseste proiectul
        id: proiect
        run: |
          find . -name "*.zip" -not -path "./.git/*" | while read z; do
            echo "Dezarhivez: $z"
            unzip -o -q "$z" -d proiect_dezarhivat
          done
          SETARI=$(find . -name settings.gradle -not -path "*/build/*" | head -1)
          if [ -z "$SETARI" ]; then
            echo "::error::Nu am gasit proiectul. Urca fisierul CautaDosare.zip (Add file > Upload files) si porneste din nou construirea."
            exit 1
          fi
          echo "Proiect gasit in: $(dirname "$SETARI")"
          echo "dir=$(dirname "$SETARI")" >> "$GITHUB_OUTPUT"

      - name: Instaleaza Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instaleaza Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construieste aplicatia
        run: |
          gradle -p "${{ steps.proiect.outputs.dir }}" assembleDebug --no-daemon --stacktrace
          cp "${{ steps.proiect.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" CautareDosare.apk

      - name: Pastreaza APK-ul (Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: CautareDosare-apk
          path: CautareDosare.apk

      - name: Publica APK-ul la Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Cautare Dosare 1.${{ github.run_number }}
          body: Descarca fisierul CautareDosare.apk de mai jos si instaleaza-l pe telefon.
          files: CautareDosare.apk
